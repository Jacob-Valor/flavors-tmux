name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
            artifact_arch: x86_64
          - os: ubuntu-24.04-arm
            artifact_os: linux
            artifact_arch: aarch64
          - os: macos-13
            artifact_os: macos
            artifact_arch: x86_64
          - os: macos-latest
            artifact_os: macos
            artifact_arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          mkdir -p dist
          artifact="flavors_tmux-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}"
          cp target/release/flavors_tmux "dist/${artifact}"
          (cd dist && sha256sum "$artifact" > "$artifact.sha256")

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: flavors_tmux-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: dist/flavors_tmux-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}*

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
