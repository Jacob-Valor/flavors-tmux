name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: linux
            arch: x86_64
          - target: aarch64-linux
            os: linux
            arch: aarch64
          - target: x86_64-macos
            os: macos
            arch: x86_64
          - target: aarch64-macos
            os: macos
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
          mkdir -p dist
          cp zig-out/bin/flavors_tmux "dist/flavors_tmux-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavors_tmux-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/flavors_tmux-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
