name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck and tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck tmux

      - name: ShellCheck linting
        run: shellcheck -e SC1091 -f gcc flavors.tmux scripts/*.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy linting
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary exists
        run: test -f target/release/flavors_tmux

      - name: Bash/Rust parity tests
        run: bash scripts/test-parity.sh

      - name: Audit dependencies
        uses: actions-rust-lang/audit@v1
        continue-on-error: true

  test-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy linting
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary exists
        run: test -f target/release/flavors_tmux
